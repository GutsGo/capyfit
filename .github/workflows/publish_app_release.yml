name: app-build-action
# 推送 Tag 时触发
on:
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4

      #APK签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties


      # 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 设置 Flutter 环境
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 更新 Flutter packages
      - name: Restore packages
        run: flutter pub get

      # 打包 APK (不配置签名即为无签名版本，或使用默认 debug 签名)
      - name: Build APK
        run: flutter build apk --split-per-abi ${{ secrets.ENV_DEFINE }}

      # 获取版本信息（自动从 Git Tag 提取）
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 重命名 APK 文件以符合发布规范
      - name: Rename APKs
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd build/app/outputs/flutter-apk/
          mv app-armeabi-v7a-release.apk capyfit-$VERSION-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk capyfit-$VERSION-arm64-v8a.apk
          mv app-x86_64-release.apk capyfit-$VERSION-x86_64.apk

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.VERSION }}"
          tag_name: "${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-x86_64.apk

      # 同时上传至 CapyFitHub 仓库的 Release
      - name: Upload to Hub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: GutsGo/CapyFitHub
          name: "${{ steps.version.outputs.VERSION }}"
          tag_name: "${{ steps.version.outputs.VERSION }}"
          target_commitish: main
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          token: ${{ secrets.HUB_RELEASE_TOKEN }}
          files: |
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/capyfit-${{ steps.version.outputs.VERSION }}-x86_64.apk
      
      # 完成
      - run: echo "🍏 Build and Release job's status is ${{ job.status }}."