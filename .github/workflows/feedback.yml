name: Feedback Issue Creator

on:
  repository_dispatch:
    types: [create_feedback_issue]

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v6
        with:
          script: |
            const { type, content, contact } = context.payload.client_payload;
            const body = `### 反馈类型\n${type}\n\n### 反馈内容\n${content}\n\n### 联系方式\n${contact || '无'}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Feedback] ${type}: ${content.substring(0, 30)}${content.length > 30 ? '...' : ''}`,
              body: body,
              labels: ['feedback', type]
            });
