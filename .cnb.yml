main:
  push:
    - name: App Release Build
      runner:
        # 使用 amd64 架构构建节点
        tags: cnb:arch:amd64
        # 指定资源配额
        cpus: 64
      docker:
        # 使用预装 Flutter 环境的镜像
        image: ghcr.io/cirruslabs/flutter:latest
      imports:
        - https://cnb.cool/bytebites.ai/secrets/-/blob/main/env.prod.yml
      stages:
        - name: 环境检查
          script: |
            java -version
            flutter doctor -v
            
        - name: 环境准备
          script: |
            # 接受 Android 协议
            yes | flutter doctor --android-licenses || true
            
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "Error: KEYSTORE_BASE64 未设置。请在 CNB 环境变量中配置。"
              exit 1
            fi
            
            # 创建 android/app/keystore.jks (Gradle 默认相对于 app 目录查找)
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            
            # 创建 android/key.properties 用于签名渲染
            # 注意：build.gradle.kts 中 file(it) 会相对于 app 目录查找
            echo "storeFile=keystore.jks" > android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            
        - name: 安装依赖
          script: flutter pub get
          
        - name: 打包构建 (APK)
          # 使用 --split-per-abi 减小体积，并注入 GITHUB_TOKEN (即 FEEDBACK_TOKEN)
          script: flutter build apk --split-per-abi --dart-define=GITHUB_TOKEN=$FEEDBACK_TOKEN
          
        - name: 文件重命名
          script: |
            # 从 pubspec.yaml 提取版本号
            VERSION_NAME=$(grep '^version: ' pubspec.yaml | sed 's/version: //;s/+.*//')
            echo "Building version: $VERSION_NAME"
            
            APK_DIR="build/app/outputs/flutter-apk"
            
            # 重命名产物，使用完整路径避免 cd 导致的路径失效
            [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ] && mv "$APK_DIR/app-armeabi-v7a-release.apk" "$APK_DIR/capyfit-$VERSION_NAME-armeabi-v7a.apk"
            [ -f "$APK_DIR/app-arm64-v8a-release.apk" ] && mv "$APK_DIR/app-arm64-v8a-release.apk" "$APK_DIR/capyfit-$VERSION_NAME-arm64-v8a.apk"
            [ -f "$APK_DIR/app-x86_64-release.apk" ] && mv "$APK_DIR/app-x86_64-release.apk" "$APK_DIR/capyfit-$VERSION_NAME-x86_64.apk"
            
        - name: 创建发布记录 (Release)
          image: cnbcool/release:latest
          settings:
            title: $APP_VERSION
            body: "自动发布版本 $APP_VERSION"
            draft: false
            prerelease: false
            
        - name: 上传 构建产物
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-armeabi-v7a.apk
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-arm64-v8a.apk
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-x86_64.apk

        # 完成
        - name: 完成
          script: echo "🍏 Build and Release job completed successfully."