main:
  push:
    - name: App Release Build
      runner:
        # 使用 arm64 架构构建节点
        tags: cnb:arch:arm64:v8
        # 指定资源配额
        cpus: 16
      docker:
        # 使用预装 Flutter 环境的镜像
        image: ghcr.io/cirruslabs/flutter:latest
      imports:
        - https://cnb.cool/bytebites.ai/secrets/-/blob/main/env.prod.yml
      # 缓存配置以加速构建
      volumes:
        - /root/.gradle:cache
        - /root/.pub-cache:cache
      stages:
        - name: 环境检查
          script: |
            java -version
            flutter doctor -v
            
        - name: 环境准备
          script: |
            # 接受 Android 协议
            yes | flutter doctor --android-licenses || true
            
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "Error: KEYSTORE_BASE64 未设置。请在 CNB 环境变量中配置。"
              exit 1
            fi
            
            # 创建 android/keystore.jks
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            
            # 创建 key.properties 用于签名
            echo "storeFile=keystore.jks" > android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            
        - name: 安装依赖
          script: flutter pub get
          
        - name: 打包构建 (APK)
          # 使用 --split-per-abi 减小体积，并注入 GITHUB_TOKEN (即 FEEDBACK_TOKEN)
          script: flutter build apk --split-per-abi --dart-define=GITHUB_TOKEN=$FEEDBACK_TOKEN
          
        - name: 文件重命名
          script: |
            # 从 pubspec.yaml 提取版本号，避免 main 分支下 VERSION 为 "main"
            VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
            # 这里的 VERSION 可能包含 + 号，处理一下
            VERSION_NAME=$(echo $VERSION | cut -d '+' -f 1)
            
            echo "Building version: $VERSION_NAME"
            
            cd build/app/outputs/flutter-apk/
            mv app-armeabi-v7a-release.apk capyfit-$VERSION_NAME-armeabi-v7a.apk
            mv app-arm64-v8a-release.apk capyfit-$VERSION_NAME-arm64-v8a.apk
            mv app-x86_64-release.apk capyfit-$VERSION_NAME-x86_64.apk
            
            # 将变量导出供后续阶段使用
            echo "APP_VERSION=$VERSION_NAME" >> $CNB_ENV
            
        - name: 创建发布记录 (Release)
          image: cnbcool/release:latest
          settings:
            title: $APP_VERSION
            body: "自动发布版本 $APP_VERSION"
            draft: false
            prerelease: false
            
        - name: 上传 构建产物
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-armeabi-v7a.apk
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-arm64-v8a.apk
              - build/app/outputs/flutter-apk/capyfit-$APP_VERSION-x86_64.apk

        # 完成
        - name: 完成
          script: echo "🍏 Build and Release job completed successfully."